# Goes in the TAP repository, as .github/workflows/tests.yml.
#
# Builds and tests any formula a pull request touches, on each platform the tap
# intends to bottle for.  brew test-bot does the work; this only says where.
#
# Generated by 'brew tap-new' and then narrowed, so it tracks what Homebrew
# actually supports today rather than what it supported when the tap was made.
# The action SHAs are pinned because that is how Homebrew pins them.
#
# macOS ONLY, and the formula is why.  It carries no depends_on because a --ffi
# build links against /usr/lib/libffi.dylib, the one macOS ships, and otool
# confirms the binary needs nothing else.  Linux has no such guarantee, so the
# container leg 'brew tap-new' generates would need depends_on "libffi" in the
# formula before it could bottle anything usable.  Adding that platform is a
# decision to test on its own.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        # ⚠️ macos-14 is GONE, not failing.  Its last runner image was published
        # 2026-09-01 where macos-15 and macos-26 publish weekly, and a job
        # requesting it is cancelled in under a second having run no steps --
        # which `gh pr checks` reports as "fail", so it reads like a formula
        # problem rather than a retired image.
        #
        # Nothing else can replace it: a bottle's tag comes from the OS that
        # BUILT it, so only a macos-14 runner makes an arm64_sonoma bottle.
        # Sonoma therefore has no bottle from here on and installs from source,
        # which this tap's README measures at about 2.4 seconds.  A Sonoma
        # machine can still build one by hand with `brew install
        # --build-bottle` and `brew bottle`, if one is ever wanted.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49 # 2026.08.10.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The Homebrew action that used to do this was withdrawn; setup-homebrew
      # now reports the path and hash for a plain actions/cache to use.
      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # A bottle is built for a pull request and nowhere else, which is why a
      # formula is added by pull request rather than pushed.
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
